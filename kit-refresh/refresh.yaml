# syntax=docker/sandbox-kit:3
# An empty mixin. Adding it to an existing sandbox (`sbx kit add`) makes sbx recreate the
# sandbox's container, which rebuilds portable's kit from its folder when the kit changed, while
# Docker's data, the home folder and the sandbox's settings stay. Adding it again is a no-op for
# the kit list. See lib/environment.mjs (refreshKit).
schemaVersion: "3"
kind: mixin
displayName: portable-refresh
description: Recreates the sandbox so it picks up portable's updated kit
version: "1.0.0"
provides: ["portable-refresh@1.0.0"]
licenses: [MIT]
