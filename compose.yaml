name: portable

# Run through bin/portable, which sets the folders below and exports secrets from the Keychain.
services:
  # Docker engine for the containers Claude starts, shared by every session. bin/portable starts it
  # before each session and it keeps running (with those containers) after sessions end. When its image
  # or settings below change, it's recreated at the next launch with no other session running, which
  # restarts the containers it runs; their data stays.
  docker:
    build:
      context: image
      target: engine
      # Without a provenance attestation, which records each build, an unchanged engine rebuilds to the
      # identical image, so compose has no reason to recreate it (see the Dockerfile).
      provenance: false
    image: portable-engine:local
    pull_policy: never
    container_name: portable-engine
    hostname: portable-engine
    # Needed to run containers inside a container: https://hub.docker.com/_/docker
    # It also lets the engine set up the outbound firewall (image/firewall.sh).
    privileged: true
    environment:
      - AWS_REGION
      - PORTABLE_FIREWALL
      - PORTABLE_ALLOW_DOMAINS
    volumes:
      # All of WORKSPACE_DIR, at the same path as in the dev containers, so bind mounts in a project's
      # compose file (./src:/app) resolve to the same files for every session, whichever folder it
      # started in. Nothing else on the Mac is visible to the engine.
      - ${WORKSPACE_DIR:?run through bin/portable or set WORKSPACE_DIR}:${WORKSPACE_DIR}
      # Folders hidden even inside WORKSPACE_DIR (load_hidden in lib/launch.sh), covered with empty,
      # read-only ones. Bind mounts the engine makes include these, so containers can't reach them.
      - &hide-self
        type: tmpfs
        target: ${PORTABLE_HIDE_SELF:?run through bin/portable}
        read_only: true
      - &hide-config
        type: tmpfs
        target: ${PORTABLE_HIDE_CONFIG:?run through bin/portable}
        read_only: true
      # Images, build cache, containers and their volumes (e.g. databases), kept across restarts.
      - docker-data:/var/lib/docker
      # TLS certificates the engine generates at start; the dev container gets the client half.
      - docker-certs:/certs
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 2s
      timeout: 5s
      retries: 30

  dev:
    build:
      context: image
      target: dev
      args:
        # Hash of image/, set by bin/portable so it can tell when the image is out of date.
        PORTABLE_IMAGE_HASH: ${PORTABLE_IMAGE_HASH:-}
    image: portable-dev:local
    # Local-only image: build it when missing instead of first trying to pull it from Docker Hub.
    pull_policy: never
    stdin_open: true
    tty: true
    # Shares the engine's network, so ports published by containers Claude starts are on localhost,
    # as on the Mac, and the engine's firewall covers this container too.
    network_mode: service:docker
    environment:
      # Passed through by name from bin/portable's environment. Do not store these in a file.
      - ANTHROPIC_API_KEY
      - CLAUDE_CODE_OAUTH_TOKEN
      # The subscription token can't read your account, so Claude Code can't tell it's Pro/Max (which
      # default to Opus) and falls back to Sonnet. This only sets the starting model; /model and a
      # `model` setting still win: https://code.claude.com/docs/en/model-config
      - ANTHROPIC_DEFAULT_MODEL=${ANTHROPIC_DEFAULT_MODEL:-opus}
      - GH_TOKEN
      - GIT_AUTHOR_NAME
      - GIT_AUTHOR_EMAIL
      - GIT_COMMITTER_NAME
      - GIT_COMMITTER_EMAIL
      # Short-lived STS credentials exported from the host profile in PORTABLE_AWS_PROFILE.
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_SESSION_TOKEN
      - AWS_CREDENTIAL_EXPIRATION
      - AWS_REGION
      - AWS_DEFAULT_REGION
      # Personal Claude configuration cloned and installed at start (image/entrypoint.sh); set in .env.
      - PORTABLE_CLAUDE_CONFIG_REPO
      - PORTABLE_CLAUDE_CONFIG_DISABLE
      # Host ~/.claude/settings.json, merged in at start minus hooks and other host commands.
      - PORTABLE_CLAUDE_SETTINGS
      # The folder this session shares, as WORKSPACE_DIR in here: paths inside it are kept when host
      # settings are merged (they exist in the container too). The rest are for doctor.sh.
      - WORKSPACE_DIR=${PORTABLE_SESSION_DIR:?run through bin/portable}
      - PORTABLE_WORKSPACE_ROOT=${WORKSPACE_DIR}
      - PORTABLE_HIDE_SELF
      - PORTABLE_HIDE_CONFIG
      # Host terminal's color support. Without them Docker sets TERM=xterm and no COLORTERM, so
      # Claude Code falls back to a smaller palette and its colors come out darker.
      - TERM
      - COLORTERM
      # Outbound firewall: `off` to disable, and extra hosts to allow (image/firewall.sh, run by the
      # engine). Here only so the entrypoint and doctor can report it.
      - PORTABLE_FIREWALL
      - PORTABLE_ALLOW_DOMAINS
      # Ports the engine opens on the Mac (lib/launch.sh); here so Claude knows which ones are.
      - PORTABLE_PORTS
      # The docker CLI talks to the engine over TLS: https://hub.docker.com/_/docker
      - DOCKER_HOST=tcp://localhost:2376
      - DOCKER_TLS_VERIFY=1
      - DOCKER_CERT_PATH=/etc/portable/docker-certs
    volumes:
      # The only host folder the container can see: the one portable was started in, inside
      # WORKSPACE_DIR. Mounted at its Mac path, so recorded paths (git worktrees, etc.) work on both sides.
      - ${PORTABLE_SESSION_DIR:?run through bin/portable}:${PORTABLE_SESSION_DIR}
      - *hide-self
      - *hide-config
      # Claude settings and history (CLAUDE_CONFIG_DIR); no credentials, those come from env.
      - claude-state:/home/dev/.claude
      # Clone of PORTABLE_CLAUDE_CONFIG_REPO; ~/.claude links into it, so it must persist too.
      - claude-configuration:/home/dev/claude-configuration
      # Only the client certificates, read-only.
      - type: volume
        source: docker-certs
        target: /etc/portable/docker-certs
        read_only: true
        volume:
          subpath: client

volumes:
  claude-state:
  claude-configuration:
  docker-data:
  docker-certs:
